version: '3.8'

services:
  agri-translate-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: agri-translate-api
    ports:
      - "8000:8000"
    volumes:
      # Persists Hugging Face downloaded models on the host machine
      - ./hf_cache:/cache
    restart: unless-stopped
    environment:
      - HF_HOME=/cache
      - PORT=8000
      - HOST=0.0.0.0
    
    # --- GPU DEPLOYMENT OPTIONS ---
    # Uncomment the block below if you have NVIDIA GPU + NVIDIA Container Toolkit installed
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  agri-translate-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: agri-translate-ui
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - API_URL=http://agri-translate-api:8000
    depends_on:
      - agri-translate-api

